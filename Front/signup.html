<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — Forge</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css?v=2">
</head>
<body>

<header>
  <nav>
    <a href="forge_landing_page.html" class="logo">forge<span>.</span></a>
    <div style="display:flex;align-items:center;gap:14px;">
      <button class="theme-toggle" id="theme-toggle-btn" type="button" aria-label="Toggle light/dark theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
      <a href="login.html" class="nav-cta">Log in</a>
    </div>
  </nav>
</header>

<div class="auth-shell">
  <div class="auth-card">
    <h1>Join Forge</h1>
    <p class="auth-sub">Create your account — predictor, jobs, and collaborators in one place.</p>

    <form id="signup-form">
      <div class="field-input">
        <label for="name">Full name</label>
        <input type="text" id="name" required autocomplete="name">
      </div>
      <div class="field-input">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="field-input">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="8" autocomplete="new-password">
      </div>
      <button type="submit" class="btn-primary" id="submit-btn" style="width:100%;margin-top:20px;">Create account</button>
      <div class="form-error" id="error-box"></div>
    </form>

    <p class="auth-foot">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="auth.js"></script>
<script>
  initThemeToggle('theme-toggle-btn');

  // Already logged in? A signup form is pointless -- go straight to the dashboard.
  (async () => {
    if (!getToken()) return;
    try {
      await apiFetch('/auth/me');
      window.location.href = 'dashboard.html';
    } catch {
      clearToken();
    }
  })();

  const form = document.getElementById('signup-form');
  const submitBtn = document.getElementById('submit-btn');
  const errorBox = document.getElementById('error-box');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creating account…';

    try {
      const data = await apiFetch('/auth/signup', {
        method: 'POST',
        body: JSON.stringify({
          name: document.getElementById('name').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      saveToken(data.access_token);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message;
      errorBox.style.display = 'block';
      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
