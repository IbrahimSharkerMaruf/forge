# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: 'Build and deploy Python app to Azure Web App: forge-salary-predictor'

on:
  push:
    branches:
    - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # No local build step here -- the bundled azure/appservice-build action only
    # supports Python up to 3.12 (stale Oryx version), while this app targets 3.13.
    # Azure's own server-side Oryx build (SCM_DO_BUILD_DURING_DEPLOYMENT, on by
    # default for Linux Python apps) supports 3.13 and installs requirements.txt
    # during deployment instead -- same mechanism that already worked previously.

    - name: 'Deploy to Azure Web App'
      uses: azure/webapps-deploy@v2
      with: 
        app-name: 'forge-salary-predictor'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_1c1b4e9e937a48e5a48ca0d222b782d3 }}
